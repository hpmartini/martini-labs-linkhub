name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Claude (e.g., "Create an issue for implementing dark mode")'
        required: true
        type: string

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ github.event.inputs.prompt || '' }}
          claude_args: |
            --allowed-tools
            Bash(gh issue:*)
            Bash(gh pr:*)
            Bash(git status)
            Bash(git diff*)
            Bash(git log*)
            Bash(pnpm *)
            Bash(npm *)
            Bash(node *)
            Bash(npx *)
            Read
            Write
            Edit
            Glob
            Grep
            WebSearch
            WebFetch

      - name: Notify dangerPete
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '0' }}
        run: |
          curl -sS -X POST "https://hostinger.martini-labs.de/hooks/github-claude" \
            -H "Authorization: Bearer ${{ secrets.OPENCLAW_HOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"issue\": \"${ISSUE_NUMBER}\",
              \"event\": \"${EVENT_NAME}\",
              \"run_id\": \"${{ github.run_id }}\"
            }"
